<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:#0F120F;color:#F2F5EE;font-family:'Noto Sans KR',-apple-system,sans-serif;overscroll-behavior-y:none;}
  a{color:#C8F169;text-decoration:none;}
  a:hover{color:#DFF9A7;}

  .bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 22px;display:flex;flex-direction:column;gap:13px;}
  .card{border:1px solid #232A20;border-radius:24px;background:#141814;padding:17px;display:flex;flex-direction:column;gap:12px;}
  .btnrow{display:grid;gap:6px;}
  .vbtn{border:1px solid #232A20;background:transparent;color:#F2F5EE;border-radius:11px;height:40px;font-size:13.5px;font-weight:900;}
  .vbtn.sub{font-size:12.5px;font-weight:800;color:#8A9680;}
  .tabbar{display:flex;border-top:1px solid #232A20;background:#0B0D0B;padding-bottom:env(safe-area-inset-bottom);}
  .tabbar button{flex:1;border:none;background:transparent;padding:13px 0 15px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;}

  .tabbar button.on .tablabel{color:#C8F169;}
  .tabbar .bar{width:16px;height:2px;background:transparent;border-radius:2px;}
  .tabbar button.on .bar{background:#C8F169;}
  .badge{position:absolute;top:8px;right:24%;background:#E9A0B8;color:#0F120F;font-size:9px;font-weight:900;border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .pill{font-size:10px;font-weight:900;letter-spacing:.6px;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;}
  .gbox{border:1px solid;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px;}
  .gnames{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;}
  .gnames span{font-size:11px;font-weight:800;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gauge{height:3px;background:#232A20;border-radius:2px;overflow:hidden;display:flex;}
  input,select{font-family:inherit;background:#0F120F;color:#F2F5EE;border:1px solid #232A20;border-radius:11px;height:44px;padding:0 13px;font-size:15px;width:100%;}
  .load{flex:1;display:flex;align-items:center;justify-content:center;color:#5E6A55;font-size:13px;font-weight:700;}
</style>

<script>
const SUPABASE_URL = 'https://osdeuvkpamwogxpwpccx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_w1vWV8KIdgamXNtmWu2VxA_2yppk-ai';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const STATE_ROW_KEY = 'events';

const T = {
  bg:'#0F120F', card:'#141814', chip:'#232A20', line:'#232A20',
  ink:'#F2F5EE', inkSoft:'#8A9680', inkFaint:'#5E6A55',
  lime:'#C8F169', limeLine:'#2F3A28', gold:'#D9B872', goldLine:'#3E3624',
  rose:'#E9A0B8', roseLine:'#4A2F39',
  male:{c:'#8FD6FF', l:'#22394A', s:'#122130'},
  female:{c:'#F5A6C0', l:'#4A2F39', s:'#2C1C24'},
  venue:{ '유니온':{c:'#FF8B36', l:'#4A2E17', s:'#2B1B0F'}, '종합운동장':{c:'#5FD8CE', l:'#1B3F3D', s:'#102725'} }
};
const WD = ['일','월','화','수','목','금','토'];
const FEMALE = new Set(['임유나','최윤하','강권숙','권은정','김로사','김미영','김오주','김은지','김준옥','김진주','김태은','곽선주','박미라','박세영','박혜빈','방미숙','쉬이핑','이명숙','이수진','이어진','전은지','최영나','홍진경','김진영','선유빈','주소연','김영진']);
const STAFF = ['서힘찬','최용호','김태은','임유나','최윤하'];
const MEMBERS_RAW = [['임유나','관내'],['김태은','관내'],['서힘찬','관내'],['최용호','관내'],['최윤하','관내'],['강권숙','관외'],['권은정','관외'],['김대경','관외'],['김로사','관외'],['김미영','관외'],['김영진','관외'],['김영하','관내'],['김오주','관외'],['김은지','관내'],['김정현','관내'],['김준옥','관외'],['김진주','관외'],['김진형','관내'],['김태경','관외'],['김태주','관내'],['김태현','관외'],['곽선주','관내'],['문건희','관내'],['박미라','관내'],['박범진','관외'],['박세영','관내'],['박진민','관내'],['박충효','관내'],['박혜빈','관외'],['방미숙','관내'],['설재훈','관내'],['손성윤','관내'],['쉬이핑','관내'],['안주성','관내'],['안창주','관내'],['유지성','관내'],['유재영','관내'],['이경규','관내'],['이동현','관외'],['이명숙','관내'],['이수진','관내'],['이어진','관외'],['이영만','관내'],['이윤재','관외'],['이응주','관내'],['이행열','관내'],['이희성','관내'],['전성호','관내'],['전유홍','관내'],['전은지','관외'],['정승식','관내'],['정일영','관외'],['차승진','관내'],['최강영','관내'],['최영나','관내'],['한정훈','관내'],['홍진경','관내'],['김영윤','관내'],['김진영','관외'],['박종혁','관외'],['선유빈','관외'],['최대환','관내'],['주소연','관내']];

function baseMembers(){
  return MEMBERS_RAW.map(([name, district]) => ({ name, district, gender: FEMALE.has(name) ? '여' : '남', is_staff: STAFF.includes(name) }));
}

const S = {
  screen:'today', dow:0, selectedId:null, myName:'', me:null,
  blob:null, votes:{}, comments:{}, notifications:[], events:[], weekStart:null, members:[]
};

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function mondayOf(d){ const x = new Date(d); const dow = x.getDay(); x.setDate(x.getDate() - (dow === 0 ? 6 : dow - 1)); x.setHours(0,0,0,0); return x; }

function computeCapacity(t, id, blob){
  const dawn = t.startTime === '06:00' && t.endTime === '08:00';
  const quota = dawn ? 8 : t.courts.length * 6;
  const fullMax = t.courts.length * 8;
  const includesCourt3 = t.location === '유니온' && t.courts.length > 1 && t.courts.some(c => c.replace(/번/g,'').trim() === '3');
  const unconfirmedMax = dawn ? 6 : (includesCourt3 ? (t.courts.length === 3 ? 12 : (t.courts.length - 1) * 8) : fullMax);
  const confirmed = !!(blob.court3Confirmed && blob.court3Confirmed[id]);
  const computedDefault = includesCourt3 ? (confirmed ? quota : unconfirmedMax) : quota;
  const override = blob.capacityOverrides && blob.capacityOverrides[id];
  return {
    quota,
    max_players: override != null ? override : computedDefault,
    includesCourt3, court3Confirmed: confirmed,
    unconfirmedMax, confirmedMax: quota
  };
}

function buildWeek(){
  const start = S.weekStart, out = [];
  const templates = (S.blob && S.blob.templates) || [];
  const skipped = (S.blob && S.blob.skippedDates) || {};
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    const day = iso(d), dow = d.getDay();
    templates.forEach(t => {
      if(!t.daysOfWeek.includes(dow)) return;
      const id = t.id + '_' + day;
      if(skipped[id]) return;
      const cap = computeCapacity(t, id, S.blob || {});
      out.push({
        id, i, date: day, dow, dowKo: WD[dow], weekend: dow === 0 || dow === 6,
        title: t.title, location: t.location, courts: t.courts.join('·') + ' 코트',
        time: t.startTime + '–' + t.endTime, start: t.startTime,
        max: cap.max_players, includesCourt3: cap.includesCourt3, court3Confirmed: cap.court3Confirmed,
        unconfirmedMax: cap.unconfirmedMax, confirmedMax: cap.confirmedMax
      });
    });
  }
  return out.sort((a,b) => (a.date + a.start).localeCompare(b.date + b.start));
}

function rosterOf(ev){
  const v = S.votes[ev.id] || {};
  const going = [], waiting = [], absent = [];
  Object.entries(v).forEach(([name, o]) => {
    const m = S.members.find(x => x.name === name);
    const row = { name, g: o.gender || (m && m.gender) || '남', district: o.district || (m && m.district) || '관내', status: o.status };
    if(o.status === 'attend' || o.status === 'late' || o.status === 'lesson') going.push(row);
    else if(o.status === 'waiting') waiting.push(row);
    else if(o.status === 'absent') absent.push(row);
  });
  const f = going.filter(p => p.g === '여'), m = going.filter(p => p.g === '남');
  return { going, waiting, absent, f, m };
}

const isAdmin = () => !!(S.me && S.me.is_staff);
const STATUS_KO = { attend:'참석', absent:'불참', late:'늦참', lesson:'레슨', waiting:'대기' };

/* ---------- 데이터 ---------- */
async function loadAll(){
  const [stateRes, votesRes, cmtRes, notiRes] = await Promise.all([
    sb.from('ignis_state').select('value').eq('key', STATE_ROW_KEY).maybeSingle(),
    sb.from('ignis_votes').select('*'),
    sb.from('ignis_comments').select('*').order('ts', { ascending: true }),
    sb.from('ignis_notifications').select('*').order('ts', { ascending: false }).limit(80)
  ]);
  S.blob = (stateRes.data && stateRes.data.value) || {};
  if(!S.blob.templates) S.blob.templates = [];

  const votes = {};
  (votesRes.data || []).forEach(r => {
    if(!votes[r.event_id]) votes[r.event_id] = {};
    votes[r.event_id][r.member_name] = { status: r.status, gender: r.gender, district: r.district };
  });
  S.votes = votes;

  const comments = {};
  (cmtRes.data || []).forEach(r => {
    if(!comments[r.event_id]) comments[r.event_id] = [];
    comments[r.event_id].push({ id: r.id, name: r.member_name, body: r.body, ts: Number(r.ts) || 0 });
  });
  S.comments = comments;

  S.notifications = (notiRes.data || []).map(r => ({
    id: r.id, ts: Number(r.ts) || 0, body: r.body,
    read: !!(r.read_by || []).includes(S.myName)
  }));

  const extra = S.blob.extraMembers || [];
  const removed = S.blob.removedMembers || {};
  const byName = new Map();
  [...baseMembers(), ...extra].forEach(m => { if(!removed[m.name]) byName.set(m.name, m); });
  S.members = Array.from(byName.values());
  S.me = S.members.find(m => m.name === S.myName) || null;
  S.events = buildWeek();
}

async function setVote(ev, status){
  if(!S.myName){ S.screen = 'login'; render(); return; }
  const cur = (S.votes[ev.id] || {})[S.myName];
  const clearing = cur && cur.status === status;
  if(!S.votes[ev.id]) S.votes[ev.id] = {};
  if(clearing) delete S.votes[ev.id][S.myName];
  else S.votes[ev.id][S.myName] = { status, gender: S.me && S.me.gender, district: S.me && S.me.district };
  render();
  try{
    if(clearing){
      await sb.from('ignis_votes').delete().eq('event_id', ev.id).eq('member_name', S.myName);
    } else {
      await sb.from('ignis_votes').upsert({
        event_id: ev.id, member_name: S.myName, status,
        gender: (S.me && S.me.gender) || null, district: (S.me && S.me.district) || null
      }, { onConflict: 'event_id,member_name' });
    }
  }catch(e){ console.error('투표 저장 실패', e); alert('저장에 실패했습니다. 통신 상태를 확인해 주세요.'); }
}

async function moveMember(ev, name){
  if(!isAdmin()) return;
  const order = ['attend','waiting','absent'];
  const cur = (S.votes[ev.id] || {})[name];
  const idx = order.indexOf(cur && cur.status);
  const next = order[(idx < 0 ? 0 : idx + 1) % order.length];
  const m = S.members.find(x => x.name === name);
  S.votes[ev.id][name] = { status: next, gender: m && m.gender, district: m && m.district };
  render();
  try{
    await sb.from('ignis_votes').upsert({
      event_id: ev.id, member_name: name, status: next,
      gender: (m && m.gender) || null, district: (m && m.district) || null
    }, { onConflict: 'event_id,member_name' });
  }catch(e){ console.error('이동 실패', e); alert('저장에 실패했습니다.'); }
}

async function toggleCourt3(ev){
  if(!isAdmin()) return;
  const next = !ev.court3Confirmed;
  try{
    const { data } = await sb.from('ignis_state').select('value').eq('key', STATE_ROW_KEY).maybeSingle();
    const blob = (data && data.value) || {};
    if(!blob.court3Confirmed) blob.court3Confirmed = {};
    blob.court3Confirmed[ev.id] = next ? true : null;
    await sb.from('ignis_state').upsert({ key: STATE_ROW_KEY, value: blob, updated_at: new Date().toISOString() });
    S.blob = blob;
    S.events = buildWeek();
    render();
  }catch(e){ console.error('3번코트 저장 실패', e); alert('저장에 실패했습니다.'); }
}

async function addComment(ev, text){
  if(!S.myName || !text.trim()) return;
  const ts = Date.now();
  if(!S.comments[ev.id]) S.comments[ev.id] = [];
  S.comments[ev.id].push({ id: 'tmp' + ts, name: S.myName, body: text.trim(), ts });
  render();
  try{ await sb.from('ignis_comments').insert({ event_id: ev.id, member_name: S.myName, body: text.trim(), ts }); }
  catch(e){ console.error('댓글 저장 실패', e); }
}

async function markNotisRead(){
  if(!S.myName) return;
  try{
    const { data } = await sb.from('ignis_notifications').select('id, read_by').limit(200);
    for(const row of (data || [])){
      if(!(row.read_by || []).includes(S.myName)){
        await sb.from('ignis_notifications').update({ read_by: [...(row.read_by || []), S.myName] }).eq('id', row.id);
      }
    }
    S.notifications = S.notifications.map(n => ({ ...n, read: true }));
  }catch(e){ console.error('읽음 처리 실패', e); }
}

/* ---------- 렌더 ---------- */
function h(html){ return html; }

function weekBar(){
  const cells = [];
  for(let i=0;i<7;i++){
    const d = new Date(S.weekStart); d.setDate(d.getDate()+i);
    const on = i === S.dow, weekend = i === 5 || i === 6;
    const accent = weekend ? T.gold : T.lime;
    const has = S.events.some(e => e.i === i);
    cells.push(`<button data-dow="${i}" style="flex:1;border:1px solid ${on?accent:(weekend?T.goldLine:T.line)};background:${on?accent:'transparent'};border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;">
      <span style="font-size:9.5px;font-weight:800;color:${on?T.bg:(weekend?T.gold:T.inkSoft)};">${WD[(i+1)%7]}</span>
      <span class="bebas" style="font-size:21px;line-height:1;color:${on?T.bg:(weekend?T.gold:T.ink)};">${d.getDate()}</span>
      <span style="width:4px;height:4px;border-radius:50%;background:${on?T.bg:(has?accent:T.line)};"></span>
    </button>`);
  }
  return `<div style="display:flex;gap:5px;padding:0 16px 13px;">${cells.join('')}</div>`;
}

function voteButtons(ev, big){
  const mine = ((S.votes[ev.id] || {})[S.myName] || {}).status;
  const main = [['attend','참석',T.lime],['absent','불참',T.rose]].map(([k,l,c]) => {
    const on = mine === k;
    return `<button class="vbtn" data-vote="${k}" data-ev="${ev.id}" style="${on?`background:${c};color:${T.bg};border-color:${c};`:''}">${l}</button>`;
  }).join('');
  const sub = [['late','늦참'],['lesson','레슨'],['waiting','대기']].map(([k,l]) => {
    const on = mine === k;
    return `<button class="vbtn sub" data-vote="${k}" data-ev="${ev.id}" style="${on?`background:${T.chip};color:${T.lime};border-color:${T.lime};`:''}">${l}</button>`;
  }).join('');
  return `<div class="btnrow" style="grid-template-columns:repeat(2,1fr);">${main}</div>
          <div class="btnrow" style="grid-template-columns:repeat(3,1fr);">${sub}</div>`;
}

function genderBoxes(ev){
  const r = rosterOf(ev);
  const boxes = [
    { key:'여', n:r.f.length, people:r.f, c:T.female },
    { key:'남', n:r.m.length, people:r.m, c:T.male }
  ].sort((a,b) => b.n - a.n);
  return boxes.map(b => `<div class="gbox" style="border-color:${b.c.l};background:${b.c.s};">
    <div style="font-size:10.5px;font-weight:900;letter-spacing:.8px;color:${b.c.c};">${b.key}자 ${b.n}</div>
    <div class="gnames">${b.people.map(p => `<span style="color:${b.c.c};">${esc(p.name)}</span>`).join('') || `<span style="color:${T.inkFaint};grid-column:span 6;text-align:left;">아직 없어요</span>`}</div>
  </div>`).join('');
}

function waitingBox(ev){
  const r = rosterOf(ev);
  if(!r.waiting.length) return '';
  return `<div style="border:1px dashed ${T.goldLine};border-radius:12px;padding:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;">
    <span style="font-size:10px;font-weight:900;letter-spacing:.8px;color:${T.gold};">대기 ${r.waiting.length}</span>
    ${r.waiting.map((p,i) => `<span style="font-size:11px;font-weight:800;color:${T.gold};">${i+1}. ${esc(p.name)} <span style="color:${T.inkFaint};font-weight:700;">${esc(p.district)}</span></span>`).join('')}
  </div>`;
}

function eventCard(ev){
  const r = rosterOf(ev);
  const v = T.venue[ev.location] || { c:T.lime, l:T.line, s:T.chip };
  const full = r.going.length >= ev.max;
  const stateC = full ? T.rose : T.gold;
  const dateBig = `${Number(ev.date.slice(5,7))}.${Number(ev.date.slice(8,10))}`;
  const c3 = ev.includesCourt3 ? `<div style="font-size:11px;font-weight:700;color:${ev.court3Confirmed?T.lime:T.gold};border-left:2px solid ${ev.court3Confirmed?T.lime:T.gold};padding-left:9px;line-height:1.5;">${ev.court3Confirmed?`3번코트 확보 · 정원 ${ev.confirmedMax}명으로 확대`:`3번코트 미확보 · 정원 ${ev.unconfirmedMax}명 (확보시 자동 확대)`}</div>` : '';
  const adminRow = isAdmin() ? `<div class="btnrow" style="grid-template-columns:repeat(${ev.includesCourt3?2:1},1fr);border-top:1px solid ${T.line};padding-top:11px;">
      ${ev.includesCourt3 ? `<button data-c3="${ev.id}" style="border:none;background:${ev.court3Confirmed?T.lime:T.chip};color:${ev.court3Confirmed?T.bg:T.lime};border-radius:11px;height:40px;font-size:11.5px;font-weight:900;">${ev.court3Confirmed?'✅ 3번코트 확보됨':'🎾 3번코트 확보'}</button>` : ''}
      <button data-open="${ev.id}" style="border:none;background:${T.chip};color:${T.lime};border-radius:11px;height:40px;font-size:11.5px;font-weight:900;">⇄ 회원 이동</button>
    </div>` : '';

  return `<div class="card" style="border-left:4px solid ${v.c};">
    <div data-open="${ev.id}" style="display:flex;flex-direction:column;gap:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="bebas" style="font-size:26px;line-height:1;">${dateBig}</span>
          <span class="pill" style="color:${ev.weekend?T.gold:T.lime};border-color:${ev.weekend?T.goldLine:T.limeLine};">${ev.dowKo} · ${ev.weekend?'주말':'평일'}</span>
        </div>
        <span class="pill" style="color:${stateC};border-color:${stateC};">${full?'정원마감':'정원 '+ev.max}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:12.5px;font-weight:900;background:${v.s};color:${v.c};border:1px solid ${v.l};padding:5px 11px;border-radius:9px;">📍 ${esc(ev.location)}</span>
        <span style="font-size:12.5px;font-weight:800;color:${v.c};">${esc(ev.courts)}</span>
      </div>
      <div class="bebas" style="font-size:44px;line-height:.86;">${ev.time}</div>
      <div style="display:flex;align-items:baseline;gap:8px;">
        <span class="bebas" style="font-size:28px;line-height:1;">${r.going.length}</span>
        <span style="font-size:12px;font-weight:700;color:${T.inkSoft};">/ ${ev.max}명 · 여${r.f.length} 남${r.m.length} · 대기 ${r.waiting.length}</span>
      </div>
      <div class="gauge"><div style="height:100%;background:${T.female.c};width:${Math.min(100, r.f.length/ev.max*100)}%;"></div><div style="height:100%;background:${T.male.c};width:${Math.min(100, r.m.length/ev.max*100)}%;"></div></div>
      <div style="display:flex;flex-direction:column;gap:7px;">${genderBoxes(ev)}</div>
      ${waitingBox(ev)}
      ${c3}
    </div>
    ${voteButtons(ev)}
    ${adminRow}
  </div>`;
}

function detailScreen(ev){
  const r = rosterOf(ev);
  const v = T.venue[ev.location] || { c:T.lime, l:T.line, s:T.chip };
  const dateBig = `${Number(ev.date.slice(5,7))}.${Number(ev.date.slice(8,10))}`;
  const groups = [
    { title:'여자 참석', n:r.f.length, people:r.f, c:T.female.c, o: r.f.length >= r.m.length ? 0 : 1 },
    { title:'남자 참석', n:r.m.length, people:r.m, c:T.male.c, o: r.m.length > r.f.length ? 0 : 1 },
    { title:'대기', n:r.waiting.length, people:r.waiting, c:T.gold, o:2 },
    { title:'불참', n:r.absent.length, people:r.absent, c:T.inkSoft, o:3 }
  ].sort((a,b) => a.o - b.o);

  const moveLabel = st => (st === 'attend' || st === 'late' || st === 'lesson') ? '→대기' : st === 'waiting' ? '→불참' : '→참석';
  const cmts = (S.comments[ev.id] || []).slice(-30);

  return `<div class="card" style="border-left:4px solid ${v.c};">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="bebas" style="font-size:28px;line-height:1;">${dateBig}</span>
          <span class="pill" style="color:${ev.weekend?T.gold:T.lime};border-color:${ev.weekend?T.goldLine:T.limeLine};">${ev.dowKo} · ${ev.weekend?'주말':'평일'}</span>
        </div>
        <span class="pill" style="color:${T.gold};border-color:${T.gold};">정원 ${ev.max}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:13px;font-weight:900;background:${v.s};color:${v.c};border:1px solid ${v.l};padding:6px 12px;border-radius:9px;">📍 ${esc(ev.location)}</span>
        <span style="font-size:13px;font-weight:800;color:${v.c};">${esc(ev.courts)}</span>
      </div>
      <div class="bebas" style="font-size:52px;line-height:.85;">${ev.time}</div>
      <div style="display:flex;align-items:baseline;gap:8px;">
        <span class="bebas" style="font-size:29px;line-height:1;">${r.going.length}</span>
        <span style="font-size:12px;font-weight:700;color:${T.inkSoft};">/ ${ev.max}명 · 대기 ${r.waiting.length}</span>
      </div>
      ${voteButtons(ev)}
    </div>

    ${isAdmin() && ev.includesCourt3 ? `<div style="border:1px dashed ${T.rose};border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:10.5px;font-weight:900;letter-spacing:1.2px;color:${T.rose};">ADMIN</div>
      <button data-c3="${ev.id}" style="border:none;background:${ev.court3Confirmed?T.lime:T.chip};color:${ev.court3Confirmed?T.bg:T.lime};border-radius:11px;height:40px;font-size:12.5px;font-weight:900;">${ev.court3Confirmed?'✅ 3번코트 확보 취소':'🎾 3번코트 확보 확인'}</button>
    </div>` : ''}

    ${groups.map(g => `<div style="border:1px solid ${T.line};border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:9px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:10.5px;font-weight:900;letter-spacing:1.2px;color:${g.c};">${g.title}</span>
        <span class="bebas" style="font-size:20px;line-height:1;color:${g.c};">${g.n}</span>
      </div>
      ${g.people.length ? g.people.map((p,i) => `<div style="display:flex;align-items:center;gap:9px;">
          <span class="bebas" style="font-size:15px;color:${T.inkFaint};width:15px;">${i+1}</span>
          <span style="font-size:14px;font-weight:800;color:${p.g==='여'?T.female.c:T.male.c};flex:1;">${esc(p.name)}</span>
          <span style="font-size:10px;font-weight:800;color:${p.status==='attend'?T.inkFaint:T.gold};border:1px solid ${p.status==='attend'?T.inkFaint:T.gold};padding:2px 7px;border-radius:6px;">${esc(p.district)}${p.status==='attend'?'':'·'+STATUS_KO[p.status]}</span>
          ${isAdmin() ? `<button data-move="${esc(p.name)}" data-ev="${ev.id}" style="border:none;background:${T.chip};color:${T.lime};border-radius:8px;padding:5px 9px;font-size:11px;font-weight:900;">${moveLabel(p.status)}</button>` : ''}
        </div>`).join('') : `<div style="font-size:12.5px;color:${T.inkFaint};">아직 없어요</div>`}
    </div>`).join('')}

    <div style="border:1px solid ${T.line};border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:11px;">
      <div style="font-size:10.5px;font-weight:900;letter-spacing:1.2px;color:${T.inkSoft};">댓글</div>
      ${cmts.length ? cmts.map(c => `<div style="display:flex;flex-direction:column;gap:3px;">
        <div style="display:flex;gap:7px;align-items:baseline;">
          <span style="font-size:12.5px;font-weight:900;color:${String(c.name).includes('AI')?T.gold:T.ink};">${esc(c.name)}</span>
          <span style="font-size:10px;color:${T.inkFaint};">${new Date(c.ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
        </div>
        <div style="font-size:13px;line-height:1.55;">${esc(c.body)}</div>
      </div>`).join('') : `<div style="font-size:12.5px;color:${T.inkFaint};">첫 댓글을 남겨보세요</div>`}
      <div style="display:flex;gap:7px;">
        <input id="cmtInput" placeholder="댓글 입력" style="flex:1;">
        <button data-cmt="${ev.id}" style="border:none;background:${T.lime};color:${T.bg};border-radius:11px;width:64px;font-size:13px;font-weight:900;">등록</button>
      </div>
    </div>`;
}

function notifScreen(){
  if(!S.notifications.length) return `<div style="color:${T.inkFaint};font-size:13px;padding:12px 4px;">알림이 없습니다.</div>`;
  return S.notifications.map(n => `<div style="border:1px solid ${n.read?T.line:T.limeLine};background:${n.read?'transparent':T.card};border-radius:20px;padding:14px;display:flex;gap:11px;">
    <div style="width:6px;height:6px;border-radius:50%;background:${n.read?'transparent':T.rose};margin-top:7px;flex-shrink:0;"></div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:13px;line-height:1.6;color:${T.ink};">${esc(n.body)}</div>
      <div style="font-size:10.5px;font-weight:700;color:${T.inkFaint};margin-top:6px;">${n.ts?new Date(n.ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}</div>
    </div>
  </div>`).join('');
}

function meScreen(){
  const initial = S.myName ? S.myName.slice(0,1) : '?';
  return `<div style="border:1px solid ${T.line};border-radius:22px;padding:18px;display:flex;align-items:center;gap:13px;">
      <div class="bebas" style="width:52px;height:52px;border-radius:50%;border:1px solid ${T.lime};color:${T.lime};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">${esc(initial)}</div>
      <div>
        <div style="font-size:17px;font-weight:900;">${esc(S.myName || '로그인 필요')}</div>
        <div style="font-size:11.5px;font-weight:700;color:${T.inkSoft};margin-top:3px;">${S.me?`${S.me.district} · ${S.me.gender}${S.me.is_staff?' · 운영진':''}`:'이름을 선택해 주세요'}</div>
      </div>
    </div>
    <div style="border:1px solid ${T.line};border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:9px;">
      <div style="font-size:10.5px;font-weight:900;letter-spacing:1.2px;color:${T.inkSoft};">이번 주 내 참석</div>
      <div class="bebas" style="font-size:40px;line-height:1;color:${T.lime};">${S.events.filter(e => ((S.votes[e.id]||{})[S.myName]||{}).status === 'attend').length}<span style="font-size:18px;color:${T.inkSoft};"> 회</span></div>
    </div>
    <button id="installBtn" style="display:none;border:1px solid ${T.lime};background:transparent;color:${T.lime};border-radius:999px;height:46px;font-size:13px;font-weight:900;">홈 화면에 앱 추가</button>
    <button id="logoutBtn" style="border:1px solid ${T.rose};background:transparent;color:${T.rose};border-radius:999px;height:46px;font-size:13px;font-weight:900;">이름 변경 / 로그아웃</button>
    <div style="font-size:11px;color:${T.inkFaint};line-height:1.7;">이 앱은 기존 이그니스 사이트와 같은 데이터를 사용합니다. 회원 관리·페널티·랭킹 등 상세 기능은 기존 사이트에서 이용해 주세요.</div>`;
}

function loginScreen(){
  const list = S.members.slice().sort((a,b) => a.name.localeCompare(b.name,'ko'));
  return `<div style="border:1px solid ${T.line};border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:13px;">
    <div style="font-size:14px;font-weight:800;">본인 이름을 선택해 주세요</div>
    <select id="nameSel">${list.map(m => `<option value="${esc(m.name)}">${esc(m.name)} (${m.gender}/${m.district})</option>`).join('')}</select>
    <button id="loginBtn" style="border:none;background:${T.lime};color:${T.bg};border-radius:11px;height:46px;font-size:14px;font-weight:900;">시작하기</button>
    <div style="font-size:11.5px;color:${T.inkFaint};line-height:1.7;">목록에 이름이 없으면 기존 사이트에서 먼저 가입해 주세요.</div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  const sc = S.screen;
  const ev = S.events.find(e => e.id === S.selectedId);
  const unread = S.notifications.filter(n => !n.read).length;

  let title = '이그니스 코트', sub = '', body = '', bar = '';
  if(sc === 'today'){
    const d0 = new Date(S.weekStart), d6 = new Date(S.weekStart); d6.setDate(d6.getDate()+6);
    sub = `${d0.getMonth()+1}월 ${d0.getDate()}일 – ${d6.getMonth()+1}월 ${d6.getDate()}일`;
    bar = weekBar();
    const list = S.events.filter(e => e.i === S.dow);
    body = list.length ? list.map(eventCard).join('') : `<div style="color:${T.inkFaint};font-size:13px;padding:14px 4px;">이 날은 등록된 일정이 없습니다.</div>`;
  } else if(sc === 'detail' && ev){
    title = ev.location; sub = `${ev.date.replace(/-/g,'.')} · ${ev.courts}`; body = detailScreen(ev);
  } else if(sc === 'notifications'){
    title = '알림'; sub = `읽지 않음 ${unread}건`; body = notifScreen();
  } else if(sc === 'login'){
    title = '로그인'; sub = '이그니스 테니스클럽'; body = loginScreen();
  } else {
    title = '내 정보'; sub = '이그니스 테니스클럽'; body = meScreen();
  }

  const tab = (key, label, badge) => `<button data-tab="${key}" class="${(sc===key||(key==='today'&&sc==='detail'))?'on':''}">
    <span class="tablabel">${label}</span><span class="bar"></span>${badge?`<span class="badge">${badge}</span>`:''}</button>`;

  app.innerHTML = `
    <div style="padding:14px 20px 12px;display:flex;align-items:center;gap:11px;flex-shrink:0;">
      ${sc==='detail'?`<button id="backBtn" style="width:36px;height:36px;border-radius:12px;border:1px solid ${T.line};background:transparent;color:${T.ink};font-size:16px;flex-shrink:0;">←</button>`:''}
      <div style="flex:1;min-width:0;">
        <div class="bebas" style="font-size:32px;line-height:.95;">${esc(title)}</div>
        <div style="font-size:11px;font-weight:800;letter-spacing:1px;color:${T.lime};margin-top:4px;">${esc(sub)}</div>
      </div>
      ${sc==='today'&&S.myName?`<div style="width:38px;height:38px;border-radius:50%;border:1px solid ${T.line};display:flex;align-items:center;justify-content:center;color:${T.lime};font-size:13px;font-weight:900;flex-shrink:0;">${esc(S.myName.slice(0,1))}</div>`:''}
    </div>
    ${bar}
    <div class="scroll">${body}</div>
    <div class="tabbar">${tab('today','SCHEDULE',0)}${tab('notifications','ALERTS',unread)}${tab('settings','ME',0)}</div>`;

  wire();
}

function wire(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    const k = b.dataset.tab;
    S.screen = k; render();
    if(k === 'notifications') markNotisRead().then(render);
  });
  app.querySelectorAll('[data-dow]').forEach(b => b.onclick = () => { S.dow = +b.dataset.dow; render(); });
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = (e) => {
    if(e.target.closest('[data-vote],[data-c3],[data-move]')) return;
    S.selectedId = b.dataset.open; S.screen = 'detail'; render();
  });
  app.querySelectorAll('[data-vote]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const ev = S.events.find(x => x.id === b.dataset.ev);
    if(ev) setVote(ev, b.dataset.vote);
  });
  app.querySelectorAll('[data-c3]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const ev = S.events.find(x => x.id === b.dataset.c3);
    if(ev) toggleCourt3(ev);
  });
  app.querySelectorAll('[data-move]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const ev = S.events.find(x => x.id === b.dataset.ev);
    if(ev) moveMember(ev, b.dataset.move);
  });
  const cmtBtn = app.querySelector('[data-cmt]');
  if(cmtBtn) cmtBtn.onclick = () => {
    const input = document.getElementById('cmtInput');
    const ev = S.events.find(x => x.id === cmtBtn.dataset.cmt);
    if(ev && input) addComment(ev, input.value);
  };
  const back = document.getElementById('backBtn');
  if(back) back.onclick = () => { S.screen = 'today'; render(); };
  const loginBtn = document.getElementById('loginBtn');
  if(loginBtn) loginBtn.onclick = async () => {
    const name = document.getElementById('nameSel').value;
    S.myName = name;
    try{ localStorage.setItem('ignis-my-name', name); }catch(e){}
    S.me = S.members.find(m => m.name === name) || null;
    S.screen = 'today';
    await loadAll();
    render();
  };
  const logout = document.getElementById('logoutBtn');
  if(logout) logout.onclick = () => {
    try{ localStorage.removeItem('ignis-my-name'); }catch(e){}
    S.myName = ''; S.me = null; S.screen = 'login'; render();
  };
  const inst = document.getElementById('installBtn');
  if(inst && deferredPrompt){
    inst.style.display = 'block';
    inst.onclick = () => { deferredPrompt.prompt(); };
  }
}

let deferredPrompt = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

(async function init(){
  try{ S.myName = localStorage.getItem('ignis-my-name') || ''; }catch(e){}
  const today = new Date();
  S.weekStart = mondayOf(today);
  S.dow = (today.getDay() + 6) % 7;
  try{
    await loadAll();
    if(!S.myName) S.screen = 'login';
    render();
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML = `<div class="load">데이터를 불러오지 못했습니다.<br>통신 상태를 확인해 주세요.</div>`;
  }
  setInterval(async () => {
    if(document.hidden || S.screen === 'login') return;
    try{ await loadAll(); render(); }catch(e){}
  }, 45000);
  if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/pwa/sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
