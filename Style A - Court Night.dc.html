<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;}
  a{color:#C8F169;text-decoration:none;}
  a:hover{color:#DFF9A7;}
</style>
</helmet>
<div style="min-height:100vh;background:#0B0D0B;display:flex;flex-direction:column;align-items:center;padding:30px 16px 50px;gap:14px;font-family:'Noto Sans KR',sans-serif;box-sizing:border-box;">
  <div style="font-size:11px;font-weight:900;letter-spacing:2px;color:#6E7A63;">STYLE A · COURT NIGHT</div>

  <div style="width:390px;max-width:92vw;height:844px;border-radius:44px;background:#000;padding:12px;box-shadow:0 40px 90px -20px rgba(0,0,0,.8);box-sizing:border-box;">
    <div style="width:100%;height:100%;border-radius:33px;background:#0F120F;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;">

      <div style="padding:16px 22px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#8A9680;">
        <span>9:41</span><span>▮▮▯</span>
      </div>

      <div style="padding:14px 22px 16px;display:flex;justify-content:space-between;align-items:flex-end;">
        <div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:.9;color:#F2F5EE;letter-spacing:1px;">IGNIS</div>
          <div style="font-size:11px;font-weight:700;letter-spacing:1.4px;color:#C8F169;margin-top:4px;">AUG 2026 · WEEK 33</div>
        </div>
        <div style="width:38px;height:38px;border-radius:50%;border:1px solid #2A3026;display:flex;align-items:center;justify-content:center;color:#C8F169;font-size:13px;font-weight:900;">정</div>
      </div>

      <div style="display:flex;gap:5px;padding:0 18px 16px;">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button onClick="{{d.onClick}}" style="flex:1;border:1px solid {{d.border}};background:{{d.bg}};border-radius:14px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;">
            <span style="font-size:9.5px;font-weight:800;letter-spacing:.6px;color:{{d.sub}};">{{d.label}}</span>
            <span style="font-family:'Bebas Neue',sans-serif;font-size:17px;line-height:1;color:{{d.color}};">{{d.date}}</span>
            <span style="width:4px;height:4px;border-radius:50%;background:{{d.dot}};"></span>
          </button>
        </sc-for>
      </div>

      <div style="flex:1;overflow-y:auto;padding:0 18px 20px;display:flex;flex-direction:column;gap:14px;">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="2">
          <div style="border:1px solid #232A20;border-radius:26px;background:linear-gradient(160deg,#161A14 0%,#101310 100%);padding:18px;display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#8A9680;">{{c.dateLabel}} · {{c.place}}</span>
              <span style="font-size:10px;font-weight:900;letter-spacing:.8px;color:{{c.stateColor}};border:1px solid {{c.stateColor}};padding:3px 8px;border-radius:999px;">{{c.state}}</span>
            </div>

            <div>
              <div style="font-family:'Bebas Neue',sans-serif;font-size:50px;line-height:.86;color:#F2F5EE;letter-spacing:1px;">{{c.time}}</div>
              <div style="font-size:14px;font-weight:700;color:#C8F169;margin-top:6px;">{{c.court}} <span style="color:#5E6A55;">·</span> {{c.label}}</div>
            </div>

            <div style="display:flex;align-items:baseline;gap:8px;">
              <span style="font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;color:#F2F5EE;">{{c.count}}</span>
              <span style="font-size:12px;font-weight:700;color:#6E7A63;">/ {{c.capacity}}명 · 대기 {{c.waiting}}</span>
            </div>
            <div style="height:3px;background:#232A20;border-radius:2px;overflow:hidden;display:flex;">
              <div style="height:100%;background:#E9A0B8;width:{{c.fPct}};"></div>
              <div style="height:100%;background:#C8F169;width:{{c.mPct}};"></div>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:5px;">
              <sc-for list="{{c.names}}" as="n" hint-placeholder-count="6">
                <span style="border:1px solid {{n.border}};color:{{n.color}};border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:700;">{{n.name}}{{n.suffix}}</span>
              </sc-for>
            </div>

            <div style="display:flex;gap:8px;">
              <sc-for list="{{c.mainVotes}}" as="v" hint-placeholder-count="2">
                <button onClick="{{v.onClick}}" style="flex:1;border:1px solid {{v.border}};background:{{v.bg}};color:{{v.color}};border-radius:15px;padding:14px 0;font-size:15px;font-weight:900;letter-spacing:.5px;cursor:pointer;">{{v.label}}</button>
              </sc-for>
            </div>
            <div style="display:flex;gap:6px;">
              <sc-for list="{{c.subVotes}}" as="v" hint-placeholder-count="3">
                <button onClick="{{v.onClick}}" style="flex:1;border:1px solid {{v.border}};background:{{v.bg}};color:{{v.color}};border-radius:11px;padding:9px 0;font-size:11.5px;font-weight:800;cursor:pointer;">{{v.label}}</button>
              </sc-for>
            </div>

            <div style="display:flex;gap:6px;border-top:1px solid #232A20;padding-top:12px;">
              <button onClick="{{c.toggleCourt}}" style="flex:1;border:none;background:{{c.courtBtnBg}};color:{{c.courtBtnColor}};border-radius:11px;padding:10px 0;font-size:11.5px;font-weight:900;cursor:pointer;">{{c.courtBtnLabel}}</button>
              <button style="flex:1;border:none;background:#232A20;color:#C8F169;border-radius:11px;padding:10px 0;font-size:11.5px;font-weight:900;cursor:pointer;">⇄ 회원 이동</button>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="display:flex;border-top:1px solid #1B211A;background:#0B0D0B;">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button style="flex:1;border:none;background:transparent;padding:12px 0 16px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;">
            <span style="font-size:11px;font-weight:900;letter-spacing:1px;color:{{t.color}};">{{t.label}}</span>
            <span style="width:16px;height:2px;background:{{t.bar}};border-radius:2px;"></span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:960}}">
class Component extends DCLogic {
  state = { dow: 0, votes: { c1: 'attend', c2: null }, court: false };

  renderVals() {
    const dowLabels = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
    const dates = ['10', '11', '12', '13', '14', '15', '16'];
    const days = dowLabels.map((label, i) => {
      const on = i === this.state.dow;
      return {
        label, date: dates[i],
        bg: on ? '#C8F169' : 'transparent',
        border: on ? '#C8F169' : '#232A20',
        color: on ? '#0B0D0B' : '#E7EBE1',
        sub: on ? '#41521C' : '#6E7A63',
        dot: on ? '#0B0D0B' : (i % 3 === 2 ? '#2F3A28' : '#C8F169'),
        onClick: () => this.setState({ dow: i })
      };
    });

    const mkVotes = (id) => {
      const cur = this.state.votes[id];
      const main = [
        { key: 'attend', label: '참석', on: '#C8F169', onText: '#0B0D0B' },
        { key: 'absent', label: '불참', on: '#E9705C', onText: '#0B0D0B' }
      ].map(b => {
        const sel = cur === b.key;
        return {
          label: b.label,
          bg: sel ? b.on : 'transparent', color: sel ? b.onText : '#E7EBE1', border: sel ? b.on : '#2A3026',
          onClick: () => this.setState(s => ({ votes: { ...s.votes, [id]: b.key } }))
        };
      });
      const sub = ['늦참', '레슨', '연참'].map((label, i) => {
        const key = ['late', 'lesson', 'series'][i];
        const sel = cur === key;
        return {
          label,
          bg: sel ? '#2F3A28' : 'transparent', color: sel ? '#C8F169' : '#8A9680', border: sel ? '#C8F169' : '#232A20',
          onClick: () => this.setState(s => ({ votes: { ...s.votes, [id]: key } }))
        };
      });
      return { main, sub };
    };

    const roster = (arr) => arr.map(p => ({
      name: p[0], suffix: p[2] ? ` ${p[2]}` : '',
      border: p[1] === 'F' ? '#4A2F39' : '#2F3A28',
      color: p[1] === 'F' ? '#E9A0B8' : '#C8F169'
    }));

    const v1 = mkVotes('c1'), v2 = mkVotes('c2');
    const cards = [
      {
        dateLabel: `8월 ${dates[this.state.dow]}일`, place: '유니온', time: '06:00–08:00', court: this.state.court ? '3·4번 코트' : '4번 코트', label: '새벽테니스',
        state: this.state.court ? '정원 12' : '정원 8', stateColor: this.state.court ? '#C8F169' : '#D9B872',
        count: '6', capacity: this.state.court ? '12' : '8', waiting: '1', fPct: '18%', mPct: '38%',
        names: roster([['박서연', 'F'], ['이지현', 'F'], ['김도훈', 'M'], ['최민석', 'M'], ['정우진', 'M'], ['한상혁', 'M', '늦참']]),
        mainVotes: v1.main, subVotes: v1.sub,
        courtBtnLabel: this.state.court ? '✅ 3번코트 확보됨' : '🎾 3번코트 확보',
        courtBtnBg: this.state.court ? '#C8F169' : '#232A20',
        courtBtnColor: this.state.court ? '#0B0D0B' : '#C8F169',
        toggleCourt: () => this.setState(s => ({ court: !s.court }))
      },
      {
        dateLabel: `8월 ${dates[this.state.dow]}일`, place: '종합운동장', time: '20:00–22:00', court: '2번 코트', label: '저녁조',
        state: '정원 12', stateColor: '#D9B872',
        count: '6', capacity: '12', waiting: '2', fPct: '25%', mPct: '25%',
        names: roster([['오하늘', 'F'], ['신유진', 'F'], ['배소연', 'F'], ['유재현', 'M'], ['조민기', 'M', '늦참'], ['강태오', 'M']]),
        mainVotes: v2.main, subVotes: v2.sub,
        courtBtnLabel: '🕗 선마감', courtBtnBg: '#232A20', courtBtnColor: '#E9705C',
        toggleCourt: () => {}
      }
    ];

    return {
      days, cards,
      tabs: [
        { label: 'SCHEDULE', color: '#C8F169', bar: '#C8F169' },
        { label: 'ALERTS', color: '#6E7A63', bar: 'transparent' },
        { label: 'ME', color: '#6E7A63', bar: 'transparent' }
      ]
    };
  }
}
</script>
</body>
</html>
